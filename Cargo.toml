[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/matbcvo/rooste-ssh"
authors = ["Martin Vooremäe"]

[workspace.dependencies]
rooste-core = { path = "crates/rooste-core" }
rooste-proto = { path = "crates/rooste-proto" }
rooste-term = { path = "crates/rooste-term" }
rooste-keys = { path = "crates/rooste-keys" }
rooste-sftp = { path = "crates/rooste-sftp" }
rooste-testkit = { path = "crates/rooste-testkit" }

alacritty_terminal = { version = "0.26.0", default-features = false }
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.36.2"
egui = "0.36.2"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
insta = "1.49.0"
egui_tiles = "0.17.1"
keyring = "4.2.0"
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
winreg = "0.56.0"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
rpassword = "7.5.4"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "fs"] }
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds small: line tables for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
