# cargo-about: third-party license notices shipped with releases.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla root certificate data (via rustls-platform-verifier).
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls"]

# Rhai's string type (see the exception in deny.toml).
[smartstring]
accepted = ["MPL-2.0"]
