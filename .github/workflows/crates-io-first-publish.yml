name: Publish to crates.io (first time)

# One-off: creates the crates on crates.io with the CARGO_REGISTRY_TOKEN
# secret. Later releases publish through trusted publishing in release.yml;
# delete this workflow and the secret afterwards.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Crates to publish (e.g. `-p rooste-sftp -p rooste-ssh`), or `--workspace`"
        default: "--workspace"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish $PACKAGES
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGES: ${{ inputs.packages }}
