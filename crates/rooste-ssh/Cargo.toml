[package]
name = "rooste-ssh"
description = "A fast, memory-safe SSH client for Linux, Windows and macOS: tabs, split panes, SFTP, port forwarding, key tools and a built-in agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ssh", "ssh-client", "sftp", "terminal", "gui"]
categories = ["network-programming", "command-line-utilities", "gui"]

[[bin]]
name = "rooste"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
chrono.workspace = true
arboard.workspace = true
eframe.workspace = true
egui.workspace = true
egui_tiles.workspace = true
futures.workspace = true
keyring.workspace = true
rooste-core.workspace = true
rooste-keys.workspace = true
rooste-protocols.workspace = true
rooste-sftp.workspace = true
rooste-terminal.workspace = true
rfd.workspace = true
rhai.workspace = true
serde.workspace = true
tokio.workspace = true
ureq.workspace = true

[dev-dependencies]
rooste-keys.workspace = true
russh.workspace = true
egui_kittest.workspace = true
rooste-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Installers and Linux packages (cargo packager, see release.yml).
# The MSI upgrade code is derived from the main binary's name ("rooste"):
# renaming the binary would make Windows install new versions side by side
# instead of upgrading.
[package.metadata.packager]
product-name = "Rooste SSH"
identifier = "ee.prica.rooste-ssh"
publisher = "Martin Vooremäe"
description = "SSH, telnet and serial terminal with tabs, SFTP and port forwarding"
long-description = "A memory-safe SSH client with saved sessions, tabs and split panes, an SFTP file panel, port forwarding, jump hosts, a key generator and a built-in SSH agent. Telnet, raw TCP and serial connections are supported too."
homepage = "https://github.com/rooste-ssh/rooste-ssh"
authors = ["Martin Vooremäe"]
license-file = "../../LICENSE"
copyright = "Copyright (c) 2026 Martin Vooremäe"
category = "DeveloperTool"
icons = ["../../packaging/icons/icon-32.png", "../../packaging/icons/icon-128.png", "../../packaging/icons/icon-256.png", "../../packaging/icons/rooste.ico"]
binaries-dir = "../../target/release"
out-dir = "../../target/packages"
binaries = [{ path = "rooste", main = true }, { path = "rooste-cli" }]
resources = ["../../LICENSE", "../../target/notices/THIRD-PARTY-LICENSES.html"]

# RPM (cargo generate-rpm -p crates/rooste-ssh).
[package.metadata.generate-rpm]
name = "rooste-ssh"
summary = "SSH, telnet and serial terminal with tabs, SFTP and port forwarding"
license = "MIT"
assets = [
    { source = "target/release/rooste", dest = "/usr/bin/rooste", mode = "755" },
    { source = "target/release/rooste-cli", dest = "/usr/bin/rooste-cli", mode = "755" },
    { source = "packaging/linux/ee.prica.rooste-ssh.desktop", dest = "/usr/share/applications/ee.prica.rooste-ssh.desktop", mode = "644" },
    { source = "packaging/linux/ee.prica.rooste-ssh.metainfo.xml", dest = "/usr/share/metainfo/ee.prica.rooste-ssh.metainfo.xml", mode = "644" },
    { source = "packaging/icons/icon-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/ee.prica.rooste-ssh.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/rooste-ssh/LICENSE", mode = "644" },
    { source = "target/notices/THIRD-PARTY-LICENSES.html", dest = "/usr/share/doc/rooste-ssh/THIRD-PARTY-LICENSES.html", mode = "644" },
]

# `cargo binstall` downloads the release archives instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rooste-ssh-{ version }-linux-x86_64.tar.gz"
bin-dir = "rooste-ssh-{ version }-linux-x86_64/{ bin }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install"]

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/rooste-ssh-{ version }-windows-x64-portable.zip"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
