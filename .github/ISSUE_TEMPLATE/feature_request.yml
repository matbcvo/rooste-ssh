name: Feature request
description: An idea for something Rooste SSH could do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The task or problem, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Any idea for how it could look or behave.
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
      description: Workarounds or other programs you use for it.
