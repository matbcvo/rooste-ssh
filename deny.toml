[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices only fail for our direct dependencies; transitive ones
# (e.g. deep inside egui) are out of our control. Vulnerabilities always fail.
unmaintained = "workspace"
ignore = [
    # Marvin attack: timing side channel in RSA private-key operations, no fixed
    # `rsa` release exists. rooste-ssh only uses RSA private keys to sign a login
    # challenge locally, once per connection; host-key checks are public-key only.
    # Dropping RSA would lock out many users. Revisit when `rsa` ships a fix.
    { id = "RUSTSEC-2023-0071", reason = "no fix available; local, low-volume signing only" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Fonts bundled by egui; their license texts ship with releases.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla root certificate data (via rustls-platform-verifier).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
