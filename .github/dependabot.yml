version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /crates/rooste-testkit/docker/openssh
      - /crates/rooste-testkit/docker/dropbear
      - /crates/rooste-testkit/docker/legacy
    schedule:
      interval: weekly
