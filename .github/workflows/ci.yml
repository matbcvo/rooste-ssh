name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.89"] # keep in sync with rust-version in Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --profile ci
      - run: cargo test --workspace --doc

  integration-linux:
    name: Integration (Linux, OpenSSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Start OpenSSH fixture
        run: |
          docker build -t rooste-openssh crates/rooste-testkit/docker/openssh
          docker run -d --rm -p 2222:22 --name rooste-openssh rooste-openssh
          for i in $(seq 1 30); do
            nc -z 127.0.0.1 2222 && break
            sleep 1
          done
      - run: cargo nextest run --workspace --profile ci --run-ignored only
        env:
          ROOSTE_TEST_SSH_ADDR: 127.0.0.1:2222
      - name: OpenSSH logs
        if: failure()
        run: docker logs rooste-openssh

  integration-windows:
    name: Integration (Windows, OpenSSH Server)
    runs-on: windows-latest
    env:
      # Throwaway account on an ephemeral runner.
      ROOSTE_TEST_SSH_ADDR: 127.0.0.1:22
      ROOSTE_TEST_SSH_USER: rooste
      # Windows rejects passwords that contain the user name.
      ROOSTE_TEST_SSH_PASSWORD: Kq7-vTn2-Lw9-xP!
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Start Windows OpenSSH Server
        shell: pwsh
        run: |
          if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }
          $password = ConvertTo-SecureString $env:ROOSTE_TEST_SSH_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $env:ROOSTE_TEST_SSH_USER -Password $password -PasswordNeverExpires
          # Keys of administrators are read from administrators_authorized_keys.
          Add-LocalGroupMember -Group Administrators -Member $env:ROOSTE_TEST_SSH_USER
          Start-Service sshd
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Copy-Item crates/rooste-testkit/docker/openssh/authorized_keys $keys
          icacls $keys /inheritance:r /grant "*S-1-5-32-544:F" /grant "SYSTEM:F"
          Restart-Service sshd
      - run: cargo nextest run --workspace --profile ci --run-ignored only
      - name: OpenSSH logs
        if: failure()
        shell: pwsh
        run: Get-WinEvent -LogName OpenSSH/Operational -MaxEvents 50 | Format-List TimeCreated, Message

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false
